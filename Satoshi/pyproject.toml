[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "satoshi"
version = "0.1.0"
description = "Institutional HFT Data Infrastructure - Real-time market data processing, risk management, and algorithmic trading platform"
authors = ["Satoshi Team <team@satoshi.finance>"]
readme = "README.md"
packages = [{include = "engines"}, {include = "infra"}]

[tool.poetry.dependencies]
python = "^3.11"
# Core async/networking
aiohttp = "^3.9.0"
websockets = "^12.0"

# Data processing & numerical
pandas = "^2.1.0"
numpy = "^1.24.0"
pyarrow = "^14.0.0"
polars = "^0.20.0"

# Data validation & types
pydantic = "^2.5.0"

# Messaging & streaming
aiokafka = "^0.10.0"
redis = "^5.0.0"

# Database & storage
asyncpg = "^0.29.0"
sqlalchemy = "^2.0.0"

# Monitoring & observability
prometheus-client = "^0.19.0"
opentelemetry-api = "^1.21.0"
opentelemetry-sdk = "^1.21.0"

# System monitoring
psutil = "^5.9.0"

# Testing & development
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
pytest-cov = "^4.1.0"

[tool.poetry.group.dev.dependencies]
# Linting & formatting
ruff = "^0.1.6"
mypy = "^1.7.0"
black = "^23.11.0"

# Type stubs
types-redis = "*"
pandas-stubs = "*"

# Development tools
ipython = "^8.18.0"
jupyter = "^1.0.0"

# API development
fastapi = "^0.104.0"
uvicorn = "^0.24.0"

# Workflow orchestration
dagster = "^1.5.0"
dagster-webserver = "^1.5.0"

[tool.poetry.group.test.dependencies]
pytest-benchmark = "^4.0.0"
pytest-mock = "^3.12.0"
hypothesis = "^6.92.0"

[tool.ruff]
line-length = 120
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex (let developers decide)
]

[tool.ruff.per-file-ignores]
"tests/**/*" = ["N802", "N806"]  # Allow non-lowercase function names in tests
"engines/data/*.py" = ["N803"]   # Allow lowercase class names for data classes

[tool.ruff.isort]
known-first-party = ["engines", "infra"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = "aiokafka.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pyarrow.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "performance: marks tests as performance benchmarks",
]

[tool.coverage.run]
source = ["engines", "infra"]
omit = ["tests/*", "*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
