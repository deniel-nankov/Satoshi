version: '3.8'

# Enterprise Development Environment
# Full stack deployment for development and testing

services:
  # PostgreSQL Registry Database
  postgres:
    image: postgres:15-alpine
    hostname: postgres
    container_name: satoshi_postgres_dev
    environment:
      POSTGRES_DB: satoshi_dev
      POSTGRES_USER: satoshi_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password_2024}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U satoshi_dev -d satoshi_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - satoshi_network
    restart: unless-stopped

  # ClickHouse TSDB
  clickhouse:
    image: clickhouse/clickhouse-server:23.8-alpine
    hostname: clickhouse
    container_name: satoshi_clickhouse_dev
    environment:
      CLICKHOUSE_DB: satoshi_dev
      CLICKHOUSE_USER: satoshi_dev
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-dev_password_2024}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
      - ./clickhouse-config:/etc/clickhouse-server/config.d
    ulimits:
      nofile: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - satoshi_network
    restart: unless-stopped

  # Redis for Caching (Optional)
  redis:
    image: redis:7-alpine
    hostname: redis
    container_name: satoshi_redis_dev
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-dev_password_2024}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - satoshi_network
    restart: unless-stopped

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    hostname: prometheus
    container_name: satoshi_prometheus_dev
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - satoshi_network
    restart: unless-stopped
    depends_on:
      - postgres
      - clickhouse

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    hostname: grafana
    container_name: satoshi_grafana_dev
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-dev_password_2024}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-clickhouse-datasource,grafana-postgresql-datasource
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - satoshi_network
    restart: unless-stopped
    depends_on:
      - prometheus
      - postgres
      - clickhouse

  # MinIO for S3-compatible storage (Lakehouse)
  minio:
    image: minio/minio:latest
    hostname: minio
    container_name: satoshi_minio_dev
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-satoshi_dev}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dev_password_2024_long_enough}
    ports:
      - "9002:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - satoshi_network
    restart: unless-stopped

  # Jaeger for Distributed Tracing
  jaeger:
    image: jaegertracing/all-in-one:latest
    hostname: jaeger
    container_name: satoshi_jaeger_dev
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
    ports:
      - "16686:16686"  # Jaeger UI
      - "14268:14268"  # Jaeger collector
    networks:
      - satoshi_network
    restart: unless-stopped

  # Elasticsearch for Log Aggregation (Optional)
  elasticsearch:
    image: elasticsearch:8.8.0
    hostname: elasticsearch
    container_name: satoshi_elasticsearch_dev
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - satoshi_network
    restart: unless-stopped

  # Kibana for Log Visualization
  kibana:
    image: kibana:8.8.0
    hostname: kibana
    container_name: satoshi_kibana_dev
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    networks:
      - satoshi_network
    restart: unless-stopped
    depends_on:
      - elasticsearch

volumes:
  postgres_data:
    name: satoshi_postgres_dev_data
  clickhouse_data:
    name: satoshi_clickhouse_dev_data
  clickhouse_logs:
    name: satoshi_clickhouse_dev_logs
  redis_data:
    name: satoshi_redis_dev_data
  prometheus_data:
    name: satoshi_prometheus_dev_data
  grafana_data:
    name: satoshi_grafana_dev_data
  minio_data:
    name: satoshi_minio_dev_data
  elasticsearch_data:
    name: satoshi_elasticsearch_dev_data

networks:
  satoshi_network:
    name: satoshi_dev_network
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16